<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>תמות חדשניות</title>
  <style>
    body { margin: 0; background: #F2F0EC; color: #252525; font-family: Arial, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-weight: 500; font-size: 28px; }
    p { line-height: 1.6; }
    a { color: #5A1F2B; }
    figure { margin: 32px 0; }
    img { width: 100%; height: auto; border-radius: 16px; }
    figcaption { margin-top: 8px; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>תמות חדשניות</h1>
    <p>הכתב מימין לשמאל. לחצו לחיצה ימנית על התמונה ובחרו שמירת תמונה.</p>
    <figure>
      <img src="/fresh-themes/fresh-1.png" alt="זכוכית" />
      <figcaption><a href="/fresh-themes/fresh-1.png">זכוכית</a> — תמונה מלאה ווויג'טים צפים</figcaption>
    </figure>
    <figure>
      <img src="/fresh-themes/fresh-2.png" alt="שקט" />
      <figcaption><a href="/fresh-themes/fresh-2.png">שקט</a> — טיפוגרפיה גדולה בלי קופסאות</figcaption>
    </figure>
    <figure>
      <img src="/fresh-themes/fresh-3.png" alt="קולנוע" />
      <figcaption><a href="/fresh-themes/fresh-3.png">קולנוע</a> — מסך רחב ושורת מידע למטה</figcaption>
    </figure>
  </main>
</body>
</html>
