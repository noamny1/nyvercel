<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>תמות חדשות</title>
  <style>
    body { margin: 0; background: #F2F0EC; color: #252525; font-family: Arial, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-weight: 500; font-size: 28px; }
    p { line-height: 1.6; }
    a.file { color: #5A1F2B; }
    figure { margin: 28px 0; }
    img { width: 100%; height: auto; border-radius: 16px; background: #fff; }
    figcaption { margin-top: 8px; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>תמות חדשות</h1>
    <p>לחצו לחיצה ימנית על התמונה ובחרו שמירת תמונה. אל תשתמשו בכפתור ההורדה של הצ'אט.</p>
    <figure>
      <img src="/new-themes/theme-a.png" alt="תמה 1" />
      <figcaption><a class="file" href="/new-themes/theme-a.png">פתיחת תמה 1</a></figcaption>
    </figure>
    <figure>
      <img src="/new-themes/theme-b.png" alt="תמה 2" />
      <figcaption><a class="file" href="/new-themes/theme-b.png">פתיחת תמה 2</a></figcaption>
    </figure>
    <figure>
      <img src="/new-themes/theme-c.png" alt="תמה 3" />
      <figcaption><a class="file" href="/new-themes/theme-c.png">פתיחת תמה 3</a></figcaption>
    </figure>
  </main>
</body>
</html>
